releaseTarget:
  upstreamRemote: upstream
  upstreamRepo: liliMozi/openhanako
  upstreamBranch: main
  forkBranch: dev
  stableOnlyDefault: true
  prereleaseFlag: --include-prerelease
  syncLog: FORK_SYNC.md
  prereleaseSync:
    enabled: true
    defaultChannel: false
    acceptFlag: --i-accept-prerelease-sync
    confirmEnv: CONFIRM
    confirmEnvAlt: SYNC_UPSTREAM_CONFIRM_TAG
    requireAcceptFlag: true
    requireConfirmExactTag: true
    allowMainHead: false
    githubPrereleaseReleasesOnly: true
    recordLastSyncedAsTargetTag: true
    alignPackageToTargetVersion: true
dashboard:
  prNumber: 1
  title: 'DRAFT: permanent fork-vs-upstream review dashboard'
  labels:
  - permanent-dashboard
  - never-merge
  - fork-sync
issueTracking:
  tracker: scripts/track-upstream-issues.mjs
  commands:
  - status
  - search
  - draft
  states:
  - existing/open
  - draft/pending-approval
  - tracked/no-upstream-issue
  submission: never
migrationContracts:
  inventory: docs/fork-sync/migration-contracts.yml
pickFromMain:
  inventory: docs/fork-sync/pick-from-main-decisions.yml
  humanDoc: docs/fork-sync/pick-from-main-decisions.md
  enforceOnDashboard: true
  forceAdoptForbiddenDecisions:
  - wait-stable
  - preserve-fork
criticalFileClasses:
- lan_connect_auth
- remote_attachment_preview
- remote_boundary_recovery
- websocket_session_identity
- desktop_packaging
- release_profile_policy
- fork_sync_maintenance
conflictRules:
  defaultResolution: main
  dryRunDefault: true
  forkOnlyFiles:
  - .envrc
  - .env.example
  - scripts/sync-upstream.mjs
  - scripts/track-upstream-issues.mjs
  - scripts/resolve-release-profile.mjs
